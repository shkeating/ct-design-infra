

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Component Preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Public+Sans:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../variables.css" />
    <style>
      body {
        padding: 2rem;
        background-color: var(--ct-color-surface-light, #fdfdfd);
        font-family: var(--ct-typography-family-body, sans-serif);
      }
    </style>
    <script type="importmap">
      { "imports": { "lit": "https://esm.sh/lit", "lit/": "https://esm.sh/lit/",

      "lit-element/": "https://esm.sh/lit-element/", "lit-html/":

      "../../packages/tokens/dist/tokens.js" } }

  <body>

    <ct-field
  theme="light"
  type="textfield"
  title="Full name"
  title-display="visible"
  title-size="regular"
  
  description="As it appears on your government-issued ID."
  name="full_name"
  
  id="field_full_name"
  is-invalid
  
  is-required
  required-text="(required)"
  orientation="vertical"
  
  placeholder="Jane Doe"
  
  
  message="Enter your full name as it appears on your ID."
  
  
  
>
  
</ct-field>


    <script type="module" src="../../ct-core.js"></script>

</html>
