

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Component Preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Public+Sans:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../variables.css" />
    <style>
      body {
        padding: 2rem;
        background-color: var(--ct-color-surface-light, #fdfdfd);
        font-family: var(--ct-typography-family-body, sans-serif);
      }
    </style>
    <script type="importmap">
      { "imports": { "lit": "https://esm.sh/lit", "lit/": "https://esm.sh/lit/",
      "@lit/reactive-element": "https://esm.sh/@lit/reactive-element",
      "lit-element/": "https://esm.sh/lit-element/", "lit-html/":

      "../../packages/tokens/dist/tokens.js" } }

  <body>

    <ct-field
  theme="light"
  type="radio"
  title="How did you hear about us?"
  title-display="visible"
  title-size="regular"
  
  
  name="referral_source"
  
  id="field_referral_source"
  
  
  is-required
  required-text="(required)"
  orientation="vertical"
  
  
  
  
  
  
  
  
>
  <ct-field-option label="Search engine" value="search" id="field_referral_search"></ct-field-option><ct-field-option label="Social media" value="social" id="field_referral_social" checked></ct-field-option><ct-field-option label="Word of mouth" value="word-of-mouth" id="field_referral_word"></ct-field-option>
</ct-field>


    <script type="module" src="../../ct-core.js"></script>
  </body>
